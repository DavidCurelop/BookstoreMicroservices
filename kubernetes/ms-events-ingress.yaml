# NGINX Ingress for the public clickstream endpoint (POST /api/events).
# Only /api/events is routed: /internal/* stays reachable just from inside the
# cluster (sidecars call http://ms-events:5004/internal/events/ingest).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms-events
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /api/events
        pathType: Prefix
        backend:
          service:
            name: ms-events
            port: { number: 5004 }
