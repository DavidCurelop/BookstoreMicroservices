apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookstore-frontend
  template:
    metadata:
      labels:
        app: bookstore-frontend
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: { app: bookstore-frontend }
      containers:
      - name: bookstore-frontend
        image: 950582354349.dkr.ecr.us-east-1.amazonaws.com/bookstore-frontend:8.1.0
        ports:
        - containerPort: 80
        env:
        - { name: NGINX_PORT, value: "80" }
        - { name: API_PROXY_PREFIX, value: "/api" }
        - { name: PROXY_PASS, value: "http://backend:5001" }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { memory: 256Mi }
        readinessProbe:
          httpGet: { path: /, port: 80 }
        livenessProbe:
          httpGet: { path: /, port: 80 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bookstore-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: bookstore-frontend }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bookstore-frontend
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: bookstore-frontend }
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
