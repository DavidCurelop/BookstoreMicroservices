apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookstore-backend
  template:
    metadata:
      labels:
        app: bookstore-backend
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: { app: bookstore-backend }
      containers:
      - name: bookstore-backend
        image: 950582354349.dkr.ecr.us-east-1.amazonaws.com/bookstore-backend:8.1.0
        ports:
        - containerPort: 5001
        envFrom:
        - secretRef: { name: bookstore-db }
        env:
        - { name: CLICKSTREAM_FILE_ENABLED, value: "true" }
        - { name: CLICKSTREAM_FILE_PATH, value: "/usr/src/app/logs/clickstream.log" }
        volumeMounts:
        - { name: logs-storage, mountPath: /usr/src/app/logs }
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { memory: 512Mi }
        readinessProbe:
          tcpSocket: { port: 5001 }
        livenessProbe:
          tcpSocket: { port: 5001 }
      volumes:
      - name: logs-storage
        persistentVolumeClaim: { claimName: bookstore-logs-pvc }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bookstore-backend
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: bookstore-backend }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bookstore-backend
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: bookstore-backend }
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
