# ms-books (US-03): catalog + stock microservice on :5002, books schema only.
# Two versions run side by side so the Ingress can canary them (90% v1 / 10% v2),
# see ms-books-ingress.yaml.
#
# Secret:
#   ms-books-db -> DB_HOST, DB_PORT, DB_NAME, DB_USER (ms_books_role), DB_PASSWORD
#
# /internal/books/* is for in-cluster callers (ms-orders) through the Services
# below and is NOT exposed by the Ingress.
#
# ms-books (all versions) is the stable in-cluster name ms-orders calls:
# http://ms-books:5002/internal/books/{reserve,release}-stock
apiVersion: v1
kind: Service
metadata:
  name: ms-books
spec:
  type: ClusterIP
  selector:
    app: ms-books
  ports:
  - port: 5002
    targetPort: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: ms-books-v1
spec:
  type: ClusterIP
  selector:
    app: ms-books
    version: v1
  ports:
  - port: 5002
    targetPort: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: ms-books-v2
spec:
  type: ClusterIP
  selector:
    app: ms-books
    version: v2
  ports:
  - port: 5002
    targetPort: 5002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-books-v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-books
      version: v1
  template:
    metadata:
      labels:
        app: ms-books
        version: v1
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels: { app: ms-books, version: v1 }
        matchLabelKeys: [pod-template-hash]
      initContainers:
      # Blocks the Node.js server until RDS is reachable and the books schema
      # is initialized and readable by ms_books_role.
      - name: wait-for-db
        image: postgres:17-alpine
        envFrom:
        - secretRef: { name: ms-books-db }
        command:
        - sh
        - -c
        - |
          until pg_isready -h "$DB_HOST" -p "${DB_PORT:-5432}" -U "$DB_USER" -d "$DB_NAME" && \
            [ "$(PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "${DB_PORT:-5432}" -U "$DB_USER" -d "$DB_NAME" -tAc \
            "SELECT has_table_privilege(current_user, 'books.books', 'SELECT')")" = "t" ]; do
            echo "Waiting for RDS PostgreSQL and books schema initialization..."
            sleep 2
          done
      containers:
      - name: ms-books
        image: 950582354349.dkr.ecr.us-east-1.amazonaws.com/bookstore-ms-books:8.1.0
        ports:
        - containerPort: 5002
        envFrom:
        - secretRef: { name: ms-books-db }
        env:
        - { name: NODE_ENV, value: "production" }
        - { name: PORT, value: "5002" }
        - { name: SERVICE_NAME, value: "ms-books-v1" }
        - { name: DB_SSL, value: "true" }
        - { name: CLICKSTREAM_FILE_ENABLED, value: "true" }
        - { name: CLICKSTREAM_FILE_PATH, value: "/var/log/clickstream/events.log" }
        volumeMounts:
        - { name: clickstream-buffer, mountPath: /var/log/clickstream }
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { memory: 512Mi }
        readinessProbe:
          httpGet: { path: /health, port: 5002 }
        livenessProbe:
          tcpSocket: { port: 5002 }
      - name: clickstream-sidecar
        image: fluent/fluent-bit:3.2.10
        args: ["--config=/fluent-bit/etc/fluent-bit.conf"]
        volumeMounts:
        - { name: clickstream-buffer, mountPath: /var/log/clickstream, readOnly: true }
        - { name: clickstream-state, mountPath: /var/lib/clickstream }
        - name: clickstream-sidecar-config
          mountPath: /fluent-bit/etc/fluent-bit.conf
          subPath: fluent-bit.conf
          readOnly: true
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 256Mi }
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: clickstream-buffer
        emptyDir:
          sizeLimit: 80Mi
      - name: clickstream-state
        emptyDir:
          sizeLimit: 256Mi
      - name: clickstream-sidecar-config
        configMap:
          name: clickstream-sidecar
---
# Canary version. It uses the same image tag as v1 until a candidate is built:
