# ms-auth (US-02): authentication microservice on :5001.
#
# Secrets:
#   ms-auth-db  -> DB_HOST, DB_PORT, DB_NAME, DB_USER (ms_auth_role), DB_PASSWORD
#   ms-auth-jwt -> AUTH_JWT_SECRET (same value the monolith uses, so SPA cookies stay valid)
#
# The Ingress must route only /api/auth and /health to this Service.
# /internal/* is for in-cluster callers (ms-orders) and must NOT be exposed.
apiVersion: v1
kind: Service
metadata:
  name: ms-auth
spec:
  type: ClusterIP
  selector:
    app: ms-auth
  ports:
  - port: 5001
    targetPort: 5001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-auth
  template:
    metadata:
      labels:
        app: ms-auth
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels: { app: ms-auth }
      initContainers:
      # Blocks the Node.js server until RDS is reachable and the auth schema
      # is initialized and readable by ms_auth_role.
      - name: wait-for-db
        image: postgres:17-alpine
        envFrom:
        - secretRef: { name: ms-auth-db }
        command:
        - sh
        - -c
        - |
          until pg_isready -h "$DB_HOST" -p "${DB_PORT:-5432}" -U "$DB_USER" -d "$DB_NAME" && \
            [ "$(PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "${DB_PORT:-5432}" -U "$DB_USER" -d "$DB_NAME" -tAc \
            "SELECT has_table_privilege(current_user, 'auth.customers', 'SELECT')")" = "t" ]; do
            echo "Waiting for RDS PostgreSQL and auth schema initialization..."
            sleep 2
          done
      containers:
      - name: ms-auth
        image: 950582354349.dkr.ecr.us-east-1.amazonaws.com/bookstore-ms-auth:8.1.0
        ports:
        - containerPort: 5001
        envFrom:
        - secretRef: { name: ms-auth-db }
        env:
        - name: AUTH_JWT_SECRET
          valueFrom:
            secretKeyRef: { name: ms-auth-jwt, key: AUTH_JWT_SECRET }
        - { name: NODE_ENV, value: "production" }
        - { name: PORT, value: "5001" }
        - { name: DB_SSL, value: "true" }
        - { name: CLICKSTREAM_FILE_ENABLED, value: "true" }
        - { name: CLICKSTREAM_FILE_PATH, value: "/var/log/clickstream/events.log" }
        volumeMounts:
        - { name: clickstream-buffer, mountPath: /var/log/clickstream }
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { memory: 512Mi }
        readinessProbe:
          httpGet: { path: /health, port: 5001 }
        livenessProbe:
          tcpSocket: { port: 5001 }
      - name: clickstream-sidecar
        image: fluent/fluent-bit:3.2.10
        args: ["--config=/fluent-bit/etc/fluent-bit.conf"]
        volumeMounts:
        - { name: clickstream-buffer, mountPath: /var/log/clickstream, readOnly: true }
        - { name: clickstream-state, mountPath: /var/lib/clickstream }
        - name: clickstream-sidecar-config
          mountPath: /fluent-bit/etc/fluent-bit.conf
          subPath: fluent-bit.conf
          readOnly: true
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 256Mi }
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: clickstream-buffer
        emptyDir:
          sizeLimit: 80Mi
      - name: clickstream-state
        emptyDir:
          sizeLimit: 256Mi
      - name: clickstream-sidecar-config
        configMap:
          name: clickstream-sidecar
